<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MedFur</title>
    <meta name="description" content="تطبيق جامعي متكامل وتفاعلي لطلاب كلية الطب البشري في جامعة الفرات يضم بنك الأتمتة، المكتبة والملفات، سوق المستلزمات والكتب الطلابية، المرئيات والشروحات، حساب المعدل والعلامات، والإعلانات مع دعم التثبيت والعمل على الهاتف." />
    <meta name="theme-color" content="#0B132B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MedFur" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icons/medfur-logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <meta property="og:title" content="MedFur" />
    <meta property="og:description" content="تطبيق جامعي متكامل وتفاعلي لطلاب كلية الطب البشري في جامعة الفرات يضم بنك الأتمتة، المكتبة والملفات، سوق المستلزمات والكتب الطلابية، المرئيات والشروحات، حساب المعدل والعلامات، والإعلانات مع دعم التثبيت والعمل على الهاتف." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./icons/icon-512x512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-['Cairo',sans-serif] antialiased selection:bg-emerald-500 selection:text-white overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // Diagnostic check if GitHub Pages is serving raw unbuilt source instead of the compiled dist/ folder
      window.addEventListener('load', function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.innerHTML.trim() === '' && window.location.hostname.indexOf('github.io') !== -1) {
            var scripts = document.querySelectorAll('script[type="module"]');
            var isRawSource = false;
            for (var i = 0; i < scripts.length; i++) {
              var src = scripts[i].getAttribute('src') || '';
              if (src.indexOf('.tsx') !== -1 || src.indexOf('/src/') !== -1) {
                isRawSource = true;
              }
            }
            if (isRawSource) {
              root.innerHTML =
                '<div dir="rtl" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#0f172a;color:#f8fafc;font-family:Cairo,sans-serif;text-align:right;">' +
                '<div style="max-width:600px;background:#1e293b;border:1px solid #334155;border-radius:16px;padding:28px;box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);">' +
                '<h2 style="margin:0 0 12px;color:#10b981;font-size:20px;font-weight:800;">تنبيه إعداد GitHub Pages (خطوة واحدة متبقية)</h2>' +
                '<p style="margin:0 0 16px;line-height:1.8;color:#cbd5e1;font-size:14px;">يبدو أن GitHub Pages يقوم حالياً بعرض ملفات الكود المصدري الخام (<code>.tsx</code>) بدلاً من النسخة المبنية (<code>dist</code>).</p>' +
                '<ol style="margin:0 0 16px;padding-right:20px;line-height:2;color:#e2e8f0;font-size:14px;">' +
                '<li>افتح مستودعك في GitHub ثم اذهب إلى <b>Settings</b> &rarr; <b>Pages</b>.</li>' +
                '<li>تحت قسم <b>Build and deployment</b>، غيّر خيار <b>Source</b> من <code>Deploy from a branch</code> إلى <b><code>GitHub Actions</code></b>.</li>' +
                '<li>سيقوم ملف <code>.github/workflows/deploy.yml</code> ببناء الموقع ونشره تلقائياً خلال دقيقة واحدة.</li>' +
                '</ol>' +
                '</div></div>';
            }
          }
        }, 3500);
      });
    </script>
  </body>
</html>
