      <stop offset="0%" stop-color="#073B2E" />
      <stop offset="100%" stop-color="#031F18" />
    </radialGradient>
    <linearGradient id="capEmerald" x1="90" y1="60" x2="430" y2="450" gradientUnits="userSpaceOnUse">
