<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="55%" stop-color="#0F1B3D" />
      <stop offset="100%" stop-color="#091024" />
    </linearGradient>
    <linearGradient id="mfEmerald" x1="96" y1="120" x2="320" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="mfSky" x1="240" y1="120" x2="424" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="120" y1="256" x2="392" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0" />
      <stop offset="30%" stop-color="#10B981" />
      <stop offset="70%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="102" stroke="#1E293B" stroke-width="4" />

  <!-- Subtle Medical Grid / Halo -->
  <circle cx="256" cy="256" r="190" stroke="#10B981" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Interconnected Geometric Monogram 'M' & 'F' with Sleek Diagonal Lines -->
  <!-- Left & Center 'M' Structure (Emerald Gradient) -->
  <path
    d="M112 376L148 140H194L238 264L282 140H328L292 376H248L272 218L234 322H206L168 218L154 376H112Z"
    fill="url(#mfEmerald)"
  />

  <!-- Connected Right 'F' Geometric Wing (Sky-Blue Gradient) -->
  <path
    d="M282 140H408L398 184H320L311 238H382L372 280H304L288 376H248L282 140Z"
    fill="url(#mfSky)"
  />

  <!-- Dynamic Medical ECG Pulse Line bridging M and F -->
  <path
    d="M96 312H186L210 268L238 344L266 286L286 312H416"
    stroke="url(#pulseGrad)"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Top Medical Star / Cross Accent -->
  <path
    d="M256 72V104M240 88H272"
    stroke="#34D399"
    stroke-width="8"
    stroke-linecap="round"
  />
</svg>
