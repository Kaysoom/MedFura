<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Luxury Deep Medical Navy Cover Background -->
    <linearGradient id="coverBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1528" />
      <stop offset="50%" stop-color="#070E1E" />
      <stop offset="100%" stop-color="#040812" />
    </linearGradient>

    <!-- Ambient Glow Behind Monogram -->
    <radialGradient id="ambientGlow" cx="256" cy="256" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#10B981" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#070E1E" stop-opacity="0" />
    </radialGradient>

    <!-- Border Rim Gradient -->
    <linearGradient id="rimGrad" x1="32" y1="24" x2="480" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.45" />
    </linearGradient>

    <!-- Primary Connected 'MF' Gradient (Emerald to Sky Blue) -->
    <linearGradient id="mfMainGrad" x1="88" y1="136" x2="436" y2="376" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="48%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Secondary 'F' Wing Highlight Gradient -->
    <linearGradient id="fWingGrad" x1="268" y1="142" x2="440" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Soft Drop Shadow for 3D Depth -->
    <filter id="monogramShadow" x="40" y="90" width="440" height="340" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Squircle Cover Base -->
  <rect width="512" height="512" rx="116" fill="url(#coverBg)" />
  <circle cx="256" cy="256" r="220" fill="url(#ambientGlow)" />
  <rect x="14" y="14" width="484" height="484" rx="104" stroke="url(#rimGrad)" stroke-width="3.5" />

  <!-- Slanted Connected Geometric 'MF' Monogram (Matching Reference Silhouette) -->
  <g filter="url(#monogramShadow)" transform="translate(256, 256) skewX(-13) translate(-252, -256)">
    <!-- Connected 'M' with Rounded Arch Shoulders + Shared 'F' Spine & Top Bar -->
    <path
      d="M 88 364
         L 88 206
         C 88 158, 120 142, 152 142
         C 178 142, 198 154, 206 174
         C 214 154, 234 142, 260 142
         L 424 142
         L 424 188
         L 304 188
         L 304 236
         L 402 236
         L 402 282
         L 304 282
         L 304 364
         L 256 364
         L 256 206
         C 256 194, 248 188, 238 188
         C 228 188, 220 194, 220 206
         L 220 364
         L 172 364
         L 172 206
         C 172 194, 164 188, 154 188
         C 144 188, 136 194, 136 206
         L 136 364
         Z"
      fill="url(#mfMainGrad)"
    />

    <!-- Crisp Accent Overlay on the 'F' Horizontal Bars for Dimensional Contrast -->
    <path
      d="M 280 142 L 424 142 L 424 188 L 304 188 L 304 236 L 402 236 L 402 282 L 280 282 Z"
      fill="url(#fWingGrad)"
      fill-opacity="0.35"
    />
  </g>
</svg>
