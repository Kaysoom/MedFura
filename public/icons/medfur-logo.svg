<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <filter id="medfurShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#052E24" flood-opacity="0.16" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="#FFFFFF" />
  <!-- Exact Geometric MF Diamond Monogram (Rotated -45 deg around center 256,256) -->
  <g transform="translate(256 256) rotate(-45) translate(-145 -145)" fill="#0D9B68" filter="url(#medfurShadow)">
    <!-- Top-left edge of diamond (y=0..38, x=0..290) -->
    <rect x="0" y="0" width="290" height="38" />
    <!-- Top-right edge of diamond (x=252..290, y=0..290) -->
    <rect x="252" y="0" width="38" height="290" />
    <!-- Bottom-left edge of diamond (x=0..38, y=54..290, gap at y=38..54) -->
    <rect x="0" y="54" width="38" height="236" />
    <!-- Bottom-right edge of diamond (y=252..290, x=54..290, gap at x=38..54) -->
    <rect x="54" y="252" width="236" height="38" />
    <!-- Inner Bar 1 (attached to bottom-left edge, y=63..101, x=0..220) -->
    <rect x="0" y="63" width="220" height="38" />
    <!-- Inner Bar 2 (attached to top-right edge, y=126..164, x=70..290) -->
    <rect x="70" y="126" width="220" height="38" />
    <!-- Inner Bar 3 (attached to bottom-left edge, y=189..227, x=0..220) -->
    <rect x="0" y="189" width="220" height="38" />
  </g>
</svg>
