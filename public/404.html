<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniPortal</title>
    <script>
      // Single Page Application routing fallback for GitHub Pages
      const segments = window.location.pathname.split('/').filter(Boolean);
      // If deployed in a GitHub repository subfolder (e.g. /repo-name/some/path)
      const repoPath = segments.length > 0 ? '/' + segments[0] + '/' : '/';
      window.location.replace(repoPath);
    </script>
  </head>
  <body style="font-family: system-ui, sans-serif; text-align: center; padding: 40px; color: #475569;">
    <h2>جاري توجيهك إلى البوابة الجامعية...</h2>
  </body>
</html>
